<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h3>Press any key to start the game</h3>

    <div class="btn-container">
      <div class="line-one">
        <div class="btn pink" id="pink" type="button">1</div>
        <div class="btn green" id="green" type="button">2</div>
      </div>
      <div class="line-two">
        <div class="btn blue" id="blue" type="button">3</div>
        <div class="btn purple" id="purple" type="button">4</div>
      </div>
    </div>

    <p class="highScore"></p>

    <script src="app.js"></script>
  </body>
</html>
